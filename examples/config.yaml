apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig

providers:
  - name: vcr-credential-provider
    matchImages:
      - "*.vultrcr.com"
    defaultCacheDuration: "11h55m"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    env:
      - name: VULTR_API_KEY
        value: "ABC123"
